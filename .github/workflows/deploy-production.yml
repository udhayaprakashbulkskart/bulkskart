name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [master, main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Require AWS secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "Missing AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY on this repository."
            echo "Add both as Actions secrets for the bulkskart-ai-deploy IAM user."
            exit 1
          fi

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy via S3 + SSM
        env:
          AWS_REGION: ap-south-1
          INSTANCE_ID: i-0984845bd6a4b06b1
          DEPLOY_BUCKET: bulkskart-deploy-prod-446333449297
          VITE_SUPABASE_URL: https://www.bulkskart.com
        run: |
          chmod +x scripts/deploy-prod-ssm.sh scripts/deploy
          bash scripts/deploy-prod-ssm.sh
